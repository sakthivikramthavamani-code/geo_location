<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User Profile - GeoReport">
    <title>Profile - GeoReport</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        accent: { 400: '#38bdf8', 500: '#0ea5e9' }
                    }
                }
            }
        }
    </script>
</head>

<body class="font-sans bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen">
    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-slate-900/80 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <span class="material-icons text-primary-500 text-3xl">location_city</span>
                        <span class="text-xl font-bold text-white">GeoReport</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a id="dashboardLink" href="#" class="text-gray-300 hover:text-white transition flex items-center">
                        <span class="material-icons mr-1">dashboard</span> Dashboard
                    </a>
                    <button onclick="GeoReport.logout()"
                        class="text-red-400 hover:text-red-300 transition flex items-center ml-4">
                        <span class="material-icons mr-1">logout</span> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-8 px-4 sm:px-6 lg:px-8 max-w-2xl mx-auto">
        <div class="glass-card p-8">
            <div class="flex items-center space-x-6 mb-8">
                <div
                    class="w-24 h-24 bg-gradient-to-br from-primary-500 to-accent-500 rounded-full flex items-center justify-center shadow-lg shadow-primary-500/30">
                    <span class="material-icons text-white text-4xl">person</span>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-white" id="profileName">Loading...</h1>
                    <p class="text-gray-400" id="profileEmail">...</p>
                    <div class="mt-2" id="profileRoles">
                        <!-- Roles badges -->
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div>
                    <h3 class="text-lg font-semibold text-white mb-4 border-b border-white/10 pb-2">Account Details</h3>
                    <div class="grid gap-4">
                        <div>
                            <label class="text-gray-400 text-sm">Full Name</label>
                            <p class="text-white text-lg" id="fullNameDisplay">-</p>
                        </div>
                        <div>
                            <label class="text-gray-400 text-sm">Email Address</label>
                            <p class="text-white text-lg" id="emailDisplay">-</p>
                        </div>
                        <div>
                            <label class="text-gray-400 text-sm">User ID</label>
                            <p class="text-gray-300 font-mono text-sm" id="userIdDisplay">-</p>
                        </div>
                    </div>
                </div>

                <div class="pt-6 border-t border-white/10">
                    <button onclick="showToast('Profile editing coming soon!', 'info')"
                        class="w-full py-3 px-4 bg-white/5 hover:bg-white/10 text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2 border border-white/10">
                        <span class="material-icons">edit</span>
                        Edit Profile
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!GeoReport.requireAuth()) return;

            const user = GeoReport.getCurrentUser();
            if (user) {
                document.getElementById('profileName').textContent = user.fullName;
                document.getElementById('fullNameDisplay').textContent = user.fullName;
                document.getElementById('profileEmail').textContent = user.email;
                document.getElementById('emailDisplay').textContent = user.email;
                document.getElementById('userIdDisplay').textContent = user.id;

                const rolesContainer = document.getElementById('profileRoles');
                user.roles.forEach(role => {
                    const badge = document.createElement('span');
                    badge.className = 'inline-block px-3 py-1 bg-primary-600/30 text-primary-300 rounded-full text-xs font-medium mr-2';
                    badge.textContent = role.replace('ROLE_', '');
                    rolesContainer.appendChild(badge);
                });

                // Set dashboard link
                const dashboardLink = document.getElementById('dashboardLink');
                if (GeoReport.isAdmin()) {
                    dashboardLink.href = '/admin-dashboard.html';
                } else {
                    dashboardLink.href = '/citizen-dashboard.html';
                }
            }
        });
    </script>
</body>

</html>
