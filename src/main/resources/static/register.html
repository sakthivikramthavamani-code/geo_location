<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for GeoReport - Public Issue Reporting System">
    <title>Register - GeoReport</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 500: '#eab308', 600: '#ca8a04', 700: '#a16207' },
                        accent: { 400: '#facc15', 500: '#eab308' }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="font-sans bg-gradient-to-br from-black via-zinc-900 to-black min-h-screen flex items-center justify-center p-4">
    <!-- Background Effects -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-primary-500/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 left-1/4 w-96 h-96 bg-primary-500/10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center space-x-2">
                <img src="/images/logo.png" alt="GeoReport Logo" class="h-12 w-auto object-contain drop-shadow-md">
                <span class="text-2xl font-bold text-white">GeoReport</span>
            </a>
        </div>

        <!-- Register Card -->
        <div class="glass-card p-8">
            <h2 class="text-2xl font-bold text-white text-center mb-2">Create Account</h2>
            <p class="text-gray-400 text-center mb-8">Join the community to report civic issues</p>

            <form id="registerForm" class="space-y-5">
                <!-- Full Name -->
                <div>
                    <label class="form-label">Full Name</label>
                    <div class="relative">
                        <span
                            class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">person</span>
                        <input type="text" id="fullName" name="fullName" required minlength="2"
                            class="input-field pl-10" placeholder="John Doe">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="form-label">Email Address</label>
                    <div class="relative">
                        <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">email</span>
                        <input type="email" id="email" name="email" required class="input-field pl-10"
                            placeholder="you@example.com">
                    </div>
                </div>

                <!-- Phone -->
                <div>
                    <label class="form-label">Phone Number <span class="text-gray-500">(Optional)</span></label>
                    <div class="relative">
                        <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">phone</span>
                        <input type="tel" id="phone" name="phone" class="input-field pl-10"
                            placeholder="+91 98765 43210">
                    </div>
                </div>

                <!-- Ward -->
                <div>
                    <label class="form-label">Ward / Area <span class="text-gray-500">(Optional)</span></label>
                    <div class="relative">
                        <span
                            class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">location_on</span>
                        <input type="text" id="ward" name="ward" class="input-field pl-10"
                            placeholder="Ward 5, Downtown">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="form-label">Password</label>
                    <div class="relative">
                        <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">lock</span>
                        <input type="password" id="password" name="password" required minlength="6"
                            class="input-field pl-10 pr-10" placeholder="••••••••">
                        <button type="button" onclick="togglePassword('password', 'passToggle1')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                            <span class="material-icons" id="passToggle1">visibility</span>
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="form-label">Confirm Password</label>
                    <div class="relative">
                        <span
                            class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">lock_outline</span>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                            class="input-field pl-10 pr-10" placeholder="••••••••">
                        <button type="button" onclick="togglePassword('confirmPassword', 'passToggle2')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                            <span class="material-icons" id="passToggle2">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Terms -->
                <div class="flex items-start">
                    <input type="checkbox" id="terms" required
                        class="mt-1 mr-2 rounded border-gray-600 bg-transparent text-primary-500 focus:ring-primary-500">
                    <label for="terms" class="text-sm text-gray-400">
                        I agree to the <a href="#" class="text-primary-400 hover:underline">Terms of Service</a>
                        and <a href="#" class="text-primary-400 hover:underline">Privacy Policy</a>
                    </label>
                </div>

                <!-- Error Message -->
                <div id="errorMessage"
                    class="hidden p-4 rounded-lg bg-red-500/20 border border-red-500/30 text-red-400 text-sm"></div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full py-3 px-4 bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-500 hover:to-primary-600 text-black font-bold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary-500/20">
                    <span class="material-icons">person_add</span>
                    Create Account
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/10"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-transparent text-gray-500">Already have an account?</span>
                </div>
            </div>

            <!-- Login Link -->
            <a href="/login.html"
                class="w-full py-3 px-4 bg-white/5 hover:bg-white/10 text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2 border border-white/10">
                <span class="material-icons">login</span>
                Sign In
            </a>
        </div>

        <!-- Footer -->
        <p class="text-center text-gray-500 text-sm mt-8">
            &copy; <span id="currentYear"></span> GeoReport. Built for Smart Cities.
        </p>
        <script>document.getElementById('currentYear').textContent = new Date().getFullYear();</script>
    </div>

    <!-- Toast Container -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
    <script>
        function togglePassword(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                toggle.textContent = 'visibility';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');

            // Validate passwords match
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner w-5 h-5"></div> Creating account...';
            errorDiv.classList.add('hidden');

            const data = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: password,
                phone: document.getElementById('phone').value || null,
                ward: document.getElementById('ward').value || null
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    // Store auth data
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: result.data.userId,
                        email: result.data.email,
                        fullName: result.data.fullName,
                        roles: result.data.roles
                    }));

                    showToast('Account created successfully!', 'success');

                    // Redirect based on role
                    setTimeout(() => {
                        if (result.data.roles.includes('ROLE_ADMIN')) {
                            window.location.href = '/admin-dashboard.html';
                        } else {
                            window.location.href = '/citizen-dashboard.html';
                        }
                    }, 1000);
                } else {
                    throw new Error(result.message || 'Registration failed');
                }
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="material-icons">person_add</span> Create Account';
            }
        });
    </script>
</body>

</html>
