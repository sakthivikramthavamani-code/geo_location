# Production configuration for cloud deployment
spring:
  profiles: prod
  
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/georeport_db}
    username: ${DATABASE_USER:georeport}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}

logging:
  level:
    root: INFO
    com.georeport: INFO
